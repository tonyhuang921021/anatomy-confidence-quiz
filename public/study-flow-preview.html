<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>刷題流程調整預覽</title><style>
:root{color-scheme:light;--ink:#19352e;--line:#dce5df;--muted:#60736d}*{box-sizing:border-box}body{margin:0;background:#f7f8f4;color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}main{max-width:1280px;margin:auto;padding:40px 28px}header{padding-bottom:24px;border-bottom:1px solid var(--line)}.eyebrow{font-size:13px;color:var(--muted);margin:0}h1{font-size:clamp(25px,5vw,38px);letter-spacing:-.03em;line-height:1.3;margin:10px 0}header p{margin:8px 0 0;color:var(--muted)}nav{display:flex;flex-wrap:wrap;gap:8px;padding:22px 0}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:9px;padding:9px 15px;color:var(--ink);min-height:44px}button[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}button:focus-visible,a:focus-visible{outline:3px solid #79ad93;outline-offset:3px}h2{font-size:24px;margin:6px 0}#description{max-width:840px;color:var(--muted);margin:8px 0 20px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}.pair.mobile{max-width:860px;margin:auto}.figure{margin:0;min-width:0}.caption{font-weight:600;margin:0 0 10px;font-size:14px}.caption span{color:var(--muted);font-weight:400;margin-left:8px}.frame{display:block;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}img{display:block;width:100%;height:auto}.mobile .frame{max-width:390px}.links{display:flex;flex-wrap:wrap;gap:20px;margin-top:25px}a{color:#27664f;text-underline-offset:4px}footer{margin-top:30px;border-top:1px solid var(--line);padding-top:18px;font-size:13px;color:var(--muted)}.note{font-size:14px;color:var(--muted)}@media(max-width:600px){main{padding:24px 16px}nav{gap:7px}button{padding:7px 11px;font-size:14px}.pair{gap:10px}h2{font-size:22px}.caption{font-size:13px}.caption span{display:none}.frame{border-radius:8px}}
</style></head><body><main><header><p class="eyebrow">09/20 · Preview</p><h1>刷題流程調整預覽</h1><p>先看主要操作，需要時再展開細節。</p></header><nav aria-label="選擇比較的頁面" id="tabs"></nav><section aria-live="polite"><h2 id="title"></h2><p id="description"></p></section><div id="pair" class="pair"><figure class="figure"><figcaption class="caption">調整前<span>原先畫面</span></figcaption><a id="before-link" class="frame" target="_blank" rel="noopener"><img id="before" alt=""></a></figure><figure class="figure"><figcaption class="caption">調整後<span>這次 Preview</span></figcaption><a id="after-link" class="frame" target="_blank" rel="noopener"><img id="after" alt=""></a></figure></div><p class="note">可點圖放大。畫面使用虛構測試紀錄；手機比較為當時可見畫面，頁面其餘內容仍可捲動。</p><div class="links"><a id="try" href="/simulation">開啟此功能</a><a href="/">開啟網站首頁</a></div><footer>這次保留模考「按儲存才保存答案」的規則；零紀錄頁暫不調整。此版本供確認操作，尚未發布到正式網站。</footer></main><script>
const items=[{"key": "quiz", "label": "手機答後", "title": "下一題留在手邊", "body": "答完後，下一題固定在手機底部。詳解與題目工具仍可往下看，錯因改成選填展開。", "size": "mobile", "href": "/start"}, {"key": "results", "label": "模考結果", "title": "同一份題目，切換看法", "body": "先看分數與分科得分，再用「錯題／沒信心／全部」切換同一份列表。校準與補強分析收進進階區。", "size": "mobile", "href": "/simulation-results"}, {"key": "simulation", "label": "開始模考", "title": "選好考卷就能開始", "body": "考卷改成選單，開始按鈕就在旁邊。四種來源、三種作答回饋及考卷統計都保留，需要時再展開。", "size": "mobile", "href": "/simulation"}, {"key": "account", "label": "帳號登入", "title": "先看到登入欄位", "body": "Email、密碼與登入集中在最前面。註冊與忘記密碼在同一區切換，通知及加入主畫面教學收在下方。", "size": "mobile", "href": "/"}, {"key": "review", "label": "複習範圍", "title": "全部科目與所選科目分清楚", "body": "年份列的按鈕複習全部科目；選科區的按鈕只帶入所選科目，兩處都顯示實際題數。例：同一個年份，全科 50 題，選藥理後 12 題。", "size": "desktop", "href": "/simulation-review"}, {"key": "pdf", "label": "另存 PDF", "title": "沿用所在頁面的範圍", "body": "PDF 沿用題庫來源、考題年份與選科，日期、章節及最近 N 題再縮小範圍。例：藥理待複習 12 題，其中曾答錯 8 題可匯出。", "size": "desktop", "href": "/simulation-review"}];
const nav=document.querySelector('#tabs');
function show(key){const d=items.find(x=>x.key===key)||items[0];for(const b of nav.children)b.setAttribute('aria-pressed',String(b.dataset.key===d.key));document.querySelector('#title').textContent=d.title;document.querySelector('#description').textContent=d.body;document.querySelector('#pair').className='pair '+d.size;for(const side of ['before','after']){const src='/study-flow-preview/'+d.key+'-'+side+'.webp';document.querySelector('#'+side).src=src;document.querySelector('#'+side).alt=d.label+'：'+(side==='before'?'調整前':'調整後');document.querySelector('#'+side+'-link').href=src;}document.querySelector('#try').href=d.href;history.replaceState(null,'','#'+d.key);}
for(const d of items){const b=document.createElement('button');b.type='button';b.textContent=d.label;b.dataset.key=d.key;b.onclick=()=>show(d.key);nav.appendChild(b);}show(location.hash.slice(1));
</script></body></html>
