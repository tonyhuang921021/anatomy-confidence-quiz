<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>一階醫師國考刷題測驗 - 救援入口</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f7f6ef;
        color: #142033;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(560px, 100%);
        border: 1px solid #dfe6ef;
        border-radius: 8px;
        background: #ffffff;
        padding: 28px;
        box-shadow: 0 18px 48px rgba(20, 32, 51, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.35;
      }

      p {
        margin: 0 0 14px;
        line-height: 1.7;
      }

      .status {
        margin: 18px 0;
        padding: 12px 14px;
        border-radius: 8px;
        background: #edf7f1;
        color: #11633c;
        font-weight: 700;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
      }

      a,
      button {
        appearance: none;
        border: 1px solid #15845a;
        border-radius: 8px;
        background: #15845a;
        color: #ffffff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }

      a.secondary,
      button.secondary {
        background: #ffffff;
        color: #15845a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>救援入口</h1>
      <p>
        這個頁面只清除本機瀏覽器裡「作答中」與測驗交接暫存，保留登入資料、已完成紀錄與待補傳佇列。
      </p>
      <p>如果剛剛交卷或進入測驗時卡住，可以先用這裡回到乾淨狀態。</p>
      <div class="status" id="status">尚未清除暫存。</div>
      <div class="actions">
        <button id="clear-button" type="button">清除卡住的作答狀態</button>
        <a class="secondary" href="/">回首頁</a>
        <a class="secondary" href="/quiz">回測驗頁</a>
        <a class="secondary" href="/results">看作答紀錄</a>
      </div>
    </main>
    <script>
      (function () {
        var status = document.getElementById("status");
        var button = document.getElementById("clear-button");
        var currentSessionKey = "anatomy-confidence-current-session";
        var startSettingsPrefix = "anatomy-confidence-start-settings:";
        var simulationTimerPrefix = "simulation-exam-timer:";

        function removeMatchingKeys(storage, predicate) {
          if (!storage) return 0;
          var removed = 0;
          try {
            var keys = [];
            for (var index = 0; index < storage.length; index += 1) {
              var key = storage.key(index);
              if (key) keys.push(key);
            }

            keys.forEach(function (key) {
              if (!predicate(key)) return;
              storage.removeItem(key);
              removed += 1;
            });
          } catch (error) {
            return removed;
          }
          return removed;
        }

        function isRescueKey(key) {
          return (
            key === currentSessionKey ||
            key.indexOf(currentSessionKey + ":") === 0 ||
            key.indexOf(startSettingsPrefix) === 0 ||
            key.indexOf(simulationTimerPrefix) === 0
          );
        }

        function clearRescueState() {
          var removed = 0;
          removed += removeMatchingKeys(window.localStorage, isRescueKey);
          removed += removeMatchingKeys(window.sessionStorage, isRescueKey);
          status.textContent = "已清除 " + removed + " 筆卡住的本機作答暫存。";
        }

        button.addEventListener("click", clearRescueState);
      })();
    </script>
  </body>
</html>
