<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>目前離線中</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ea;
        --card: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --accent: #0f766e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top, #fffaf0 0%, var(--bg) 65%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
      }
      .card {
        width: min(100%, 440px);
        padding: 28px;
        border-radius: 28px;
        background: var(--card);
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      }
      .eyebrow {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.2;
      }
      p {
        margin: 14px 0 0;
        color: var(--muted);
        line-height: 1.8;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Offline</p>
      <h1>目前離線中</h1>
      <p>如果你剛剛有開過這個網站，部分頁面之後會更快重新打開。等網路恢復後，再重新整理就能回到完整功能。</p>
    </main>
  </body>
  </html>
